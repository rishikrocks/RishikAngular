<p>commentlist works!</p>
<h3 class = "text-center">Comment List</h3>
<table class = "table table-bordered">
    <tbody>
        @for(comment of commentData| async;track $index){
            <tr>
                <td>{{comment.name}}</td>
                <td>{{comment.id}}</td>
                <td>{{comment.email}}</td>
                <td>{{comment.body}}</td>

            </tr>
        }
    </tbody>
</table>
