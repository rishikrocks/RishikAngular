<div class="border border-3 rounded-3 p-3 col-sm-4 offset-4">
<form #myForm="ngForm" (submit)="submitMyForm(myForm.value)">
    <p>FirstName: <input name="firstName" [(ngModel)]="user.firstName" #firstName="ngModel" required minlength="5"/> </p>
      @if(firstName.hasError('required')){
        <span class="text-danger">FirstName is a required field</span>
      }
      @if(firstName.hasError('minlength')){
        <span class="text-danger">FirstName should have minimum 5 chars</span>
      }
    <p>lastName: <input name="lastName" [(ngModel)]="user.lastName" #lastName="ngModel"/> </p>
    <p>email: <input name="email" ngModel /> </p>

    <div ngModelGroup="address">
    <p>city: <input name="city" ngModel /> </p>
    <p>state: <input name="state" ngModel /> </p>
    <p>pincode: <input name="pincode" ngModel /> </p>
    </div>
    <input type="reset" value="Reset"/>
    <input type="submit" value="Submit" class="mx-1" [disabled]="myForm.invalid"/>
</form>
<pre> {{myForm.value | json}}</pre>
</div>
